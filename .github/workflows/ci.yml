name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==2.2.6 scipy==1.17.1 pandas==2.3.3 scikit-learn==1.8.0 matplotlib==3.11.1 qiskit==2.4.2 pytest==9.1.1
          pip install -e . --no-deps
      - name: Unit tests
        run: pytest -q
      - name: Smoke run of all experiments
        run: python experiments/run_all.py --quick
